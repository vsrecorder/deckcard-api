services:
  deckcard-api:
    image: vsrecorder/deckcard-api:latest
    restart: unless-stopped
    #
    # メモリ上限。本番は単一VM(4vCPU/4GiB)に PostgreSQL・nginx・webapp・
    # 各APIサーバが同居しているため、上限が無いとリークを起こしたコンテナが
    # ホストのメモリを食い尽くし、カーネルのOOM Killerが巻き添えで
    # PostgreSQL を殺しうる。上限は暴走を1コンテナに閉じ込めるためのもので、
    # 平常時には当たらない値にしてある。
    #
    # memswap_limit を mem_limit と同値にしてスワップへの逃げを塞ぐ
    # (未指定だと docker は「メモリ+スワップ」を mem_limit の2倍まで許す)。
    #
    # network_mode: host と cgroup のメモリ制限は独立しているため、
    # ホストネットワークのままでもこの制限は効く。
    #
    # 768m の根拠: 2026-11-25 の本番実測(docker stats)でコンテナ全体 457MiB
    # (uvicorn worker が 235MB と 228MB、gunicorn master が 20MB)。約1.7倍を取っている。
    # ワーカーのメモリは漏れではなく、レスポンスキャッシュ(app/core/cache.py)が満杯になった
    # ときの量で、そこで頭打ちになる(作業機で 14,000 件流して確認。7,000 件以降は横ばい)。
    # 以前の 512m は、キャッシュがほとんど空だった 2026-08-16 の 180MiB を基準にしていたため、
    # 満杯になると 89% まで来て、同時に走る HTML の解析のぶんの余裕が無かった。
    #
    # 空きを作る目的でワーカーを定期的に入れ替える(gunicorn の --max-requests)のは採らない。
    # 作業機で試すと、入れ替えのたびに処理中の接続が切れて、6,000 件中 122 件が失敗した。
    #
    # キャッシュの maxsize か gunicorn の -w を増やすと、そのぶんがそのまま上乗せされる
    # (キャッシュは /detail 1件あたり約 27KB、ワーカーは1本あたり 230MB 前後)。
    # その際はこの値も併せて見直すこと。
    #
    # mem_reservation は満杯時の実測に合わせている。
    #
    mem_limit: 768m
    memswap_limit: 768m
    mem_reservation: 480m
    network_mode: "host"
    #
    # 応答できる状態になったかの判定。
    #
    # これが無いと `docker compose up --wait` は「コンテナが起動した」だけで完了し、
    # gunicorn がワーカーを立ち上げる前にデプロイが終わったことになる。
    #
    # curl は入っていないので python で叩く(/health は空のJSONを返すだけの経路)。
    #
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    #
    # 注意: network_mode: host では、この ports は docker に無視される(公開の設定にならない)。
    # 待ち受けるアドレスはアプリ自身が決めており、Dockerfile の CMD(gunicorn の -b 127.0.0.1:8080)で
    # ループバックだけに絞っている(2026-10-31 の精査で、全インターフェースに開いていたのを直した)。
    # host ネットワークをやめる場合は、ここを "127.0.0.1:ポート:ポート" の形にし、アプリ側の待ち受けも見直すこと。
    #
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Tokyo
      - DB_HOSTNAME=${DB_HOSTNAME}
      - DB_PORT=${DB_PORT}
      - DB_USER_NAME=${DB_USER_NAME}
      - DB_USER_PASSWORD=${DB_USER_PASSWORD}
      - DB_NAME=${DB_NAME}
