upstream api {
    least_conn;
    server deckcard-api-deckcard-api-1:8080 weight=5 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://localhost:8080/;
    }
}