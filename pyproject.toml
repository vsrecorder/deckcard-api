[project]
name = "deckcard-api"
version = "0.1.0"
description = ""
authors = [
    {name = "sosomasox",email = "sosomasox@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4 (==4.12.2)",
    "fastapi (>=0.137.2,<0.138.0)",
    "uvicorn (==0.38.0)",
    "requests (==2.33.0)",
    "python-dotenv (==1.2.2)",
    "psycopg (==3.3.2)",
    "psycopg-binary (==3.3.2)",
    "psycopg-pool (==3.3.0)",
    "cachetools (==7.0.3)",
    "gunicorn (>=26.2.0,<27.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
# package-mode = false のためプロジェクトが site-packages に入らない。
# poetry run pytest からでも app パッケージを解決できるようルートを通す。
pythonpath = ["."]
testpaths = ["tests"]
