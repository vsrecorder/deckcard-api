# Dependabot の設定(依存の更新を週 1 回、PR として提案させる)
#
# 2026-10-31 のセキュリティ精査で、既知の脆弱性を含む依存や、サポートの切れたツールチェーン
# (Go 1.25)・ベースイメージが気付かれないまま残っていたため導入した。
#
# - マイナー・パッチの更新はエコシステムごとに 1 本の PR にまとめる(PR の数を増やさない)。
#   メジャーの更新は依存ごとに別の PR になるので、変更点を読んでから取り込む。
# - cooldown: 公開から 7 日たっていない版は提案しない。乗っ取られたアカウントから公開された
#   直後の版をそのまま取り込む、サプライチェーン攻撃の典型を避けるため。
#   脆弱性の修正(security updates)には cooldown が効かないので、そちらは待たずに来る。
# - 脆弱性のアラートと修正 PR(security updates)は、この設定ファイルとは別に、GitHub の
#   リポジトリの Settings → Advanced Security で Dependabot alerts / security updates を有効にする。
version: 2
updates:
  # Python の依存(pyproject.toml / poetry.lock。Poetry は pip のエコシステムとして扱われる)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]

  # Dockerfile のベースイメージ(python)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # python のイメージはパッチ版(3.11.x)だけを提案させる。
    # Docker のタグでは 3.11 → 3.15 もマイナー更新として扱われ、2026-11-02 に 3.15.0 への PR(#7)を
    # 取り込んだところ、psycopg-binary / pydantic-core に cp315 の wheel が無く、イメージのビルドが
    # 通らなくなった。Python のバージョンを上げるときは、依存の対応状況を確かめてから手で上げる。
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
